# ============================================================================
#  THE THREE BRANCHES OF THE CLUB
#  Add, remove, or reorder branches freely — the site adapts to how many
#  there are. "accent" picks the colour and must be one of:
#      gold   green   blue   coral
# ============================================================================

- name: Research
  accent: blue
  summary: >-
    Sharing and discussing the latest in longevity research.
  points:
    - Connect with Cornell labs researching the biology of aging.
    - Run a journal club to discuss the latest discoveries.
    - Host speaker events with leading scientists.
  representative: Scientific Research Branch Lead

- name: Philosophy, Ethics and Arts
  accent: green
  summary: >-
    Discuss the political, ethical, and artistic implications of extended human life. 
  points:
    - Host ethical and philosophical debates around the risk of overpopulation, access to longevity therapies, and biotechnology regulation.
    - Curate literature on the social and cultural aspects of extended lifespan and immortality.
    - Host a dance show or a student-led art gallery.
  representative: PEA Branch Lead

- name: Industry
  accent: gold
  summary: >-
    The bridge between Cornell and the longevity biotechnology industry.
  points:
    - Organize fireside chats with industry leaders.
    - Host networking events with entrepreneurs and investors in the longevity space.
    - Launch careers in the longevity biotechnology industry.
  representative: Industry Branch Lead
