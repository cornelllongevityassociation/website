name: Cornell Longevity Association
short_name: CLA
tagline: A student hub for longevity science across Cornell.

# Shown in the browser tab after the page name, e.g. "About · Cornell Longevity Association"
title_suffix: Cornell Longevity Association

# Only used by the 404 page, which has to link home from an unknown URL.
#   Served from   https://<org>.github.io/website/   ->  base_url: /website
#   Served from   https://your-own-domain.org/       ->  base_url: (leave blank)
base_url: /website

# Used for social sharing previews and SEO.
description: >-
  The Cornell Longevity Association connects students and faculty across the
  Ithaca, Cornell Tech, and Weill Cornell campuses around the science, ethics,
  and industry of human longevity.

