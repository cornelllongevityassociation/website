{# Standalone, so it renders correctly no matter which URL GitHub Pages
   serves it for. All styles are inline; nothing is loaded from assets/. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title_suffix }}</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #383735; color: #E9E5DD;
    font-family: "Jost", "Century Gothic", ui-sans-serif, system-ui, sans-serif;
    padding: 2rem; text-align: center;
  }
  .box { max-width: 30rem; }
  .code { font-size: .8rem; letter-spacing: .22em; color: #B3AEA4; margin: 0 0 1.25rem; }
  h1 { font-size: clamp(1.9rem, 5vw, 2.75rem); font-weight: 300; margin: 0 0 1.25rem; line-height: 1.15; }
  .rule {
    width: 150px; height: 3px; border-radius: 3px; background: #EFA83B;
    margin: 0 auto 1.5rem;
  }
  p { color: #B3AEA4; line-height: 1.6; margin: 0 0 2rem; }
  a {
    display: inline-block; background: #EFA83B; color: #2E2110;
    text-decoration: none; font-weight: 500;
    padding: .72rem 1.4rem; border-radius: 999px;
  }
  a:hover { background: #FFBE55; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">ERROR 404</p>
    <h1>{{ page.heading }}</h1>
    <div class="rule"></div>
    <p>{{ page.body }}</p>
    <a href="{{ site.base_url }}/">{{ page.button.label }}</a>
  </div>
</body>
</html>
